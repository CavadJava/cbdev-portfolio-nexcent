<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- header content start -->
    <header>
        <div class="flex-header">
            <div class="company-logo">
                <div class="company-img">
                    <img src="assets/images/svg/logo/header-company-logo.svg" alt="Company Logo">
                </div>
            </div>
            <div class="group-menu">
                <nav class="heading-navigation">
                    <ul class="navbar-items">
                        <li class="navbar-item"><a href="#">Home</a></li>
                        <li class="navbar-item"><a href="#">Services</a></li>
                        <li class="navbar-item"><a href="#">Feature</a></li>
                        <li class="navbar-item"><a href="#">Product</a></li>
                        <li class="navbar-item"><a href="#">Testimonial</a></li>
                        <li class="navbar-item"><a href="#">FAQ</a></li>
                    </ul>
                </nav>
            </div>
            <div class="login-signup">
                <div class="login-area">
                    <button>Login</button>
                </div>
                <div class="signup-area">
                    <button>Sign up</button>
                </div>
            </div>
        </div>
    </header>
    <!-- header content end -->

    <!-- main content start -->
    <main>
        <div class="flex-main">
            <!-- hero container start-->
            <section class="hero">
                <div class="hero-container">
                    <div class="hero-side hero-left-frame">
                        <div class="hero-text">
                            <h1>Lessons and insights <span style="color: var(--green-bg-color)">from 8 years</span></h1>
                            <p>Where to grow your business as a photographer: site or social media?</p>
                        </div>
                        <div class="hero-button">
                            <button>Register</button>
                        </div>
                    </div>
                    <div class="hero-side hero-right-illustration">
                        <div class="right-illustration">
                            <img src="assets/images/svg/main/main-right-side.svg" alt="" class="src">
                        </div>
                    </div>
                </div>
            </section>
            <!-- hero container end-->


            <!-- clients container end-->
            <section class="clients">
                <div class="clients-container">
                    <div class="clients-start">
                        <h2>Our Clients</h2>
                        <p>We have been working with some Fortune 500+ clients</p>
                    </div>
                    <div class="clients-end">
                        <nav class="client-logos navigation">
                            <ul class="clients-nav-items">
                                <li class="clients-nav-item">
                                    <img src="assets/images/svg/main/client/client-logo-1.svg" alt="Client Logo 1">
                                </li>
                                <li class="clients-nav-item">
                                    <img src="assets/images/svg/main/client/client-logo-2.svg" alt="Client Logo 1">
                                </li>
                                <li class="clients-nav-item">
                                    <img src="assets/images/svg/main/client/client-logo-3.svg" alt="Client Logo 1">
                                </li>
                                <li class="clients-nav-item">
                                    <img src="assets/images/svg/main/client/client-logo-4.svg" alt="Client Logo 1">
                                </li>
                                <li class="clients-nav-item">
                                    <img src="assets/images/svg/main/client/client-logo-5.svg" alt="Client Logo 1">
                                </li>
                                <li class="clients-nav-item">
                                    <img src="assets/images/svg/main/client/client-logo-6.svg" alt="Client Logo 1">
                                </li>
                                <li class="clients-nav-item">
                                    <img src="assets/images/svg/main/client/client-logo-7.svg" alt="Client Logo 1">
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </section>
            <!-- clients container end-->

        </div>

    </main>
    <!-- main content end -->

</body>
</html>
